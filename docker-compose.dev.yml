services:
  web:
    volumes:
      - ./app.py:/app/app.py
      - ./templates:/app/templates
      - ./static:/app/static
      - ./.env:/app/.env
    environment:
      - FLASK_DEBUG=1
      - FLASK_ENV=development
    command: python -m flask run --host=0.0.0.0 --port=5000
    labels:
      - "app.mode=dev"
    healthcheck: null