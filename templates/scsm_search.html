{% extends "base.html" %}

{% block title %}PCM Compass - SCSM Search{% endblock %}

{% block header %}SCSM Search{% endblock %}

{% block content %}
<div class="scsm-layout">
  <section class="scsm-master">
    <div class="scsm-searchbar">
      <span class="scsm-search-icon">⌕</span>
      <input id="scsm-query" type="text" placeholder="Search by ticket ID, keyword, or user name…"
             autocomplete="off" spellcheck="false" aria-label="Search SCSM">
      <kbd class="scsm-kbd">Ctrl&nbsp;K</kbd>
    </div>
    <div id="scsm-filters" class="scsm-filters">
      <select id="scsm-tier" aria-label="Tier / Queue"><option value="">All tiers</option></select>
      <select id="scsm-status" aria-label="Status"><option value="">All statuses</option></select>
      <input id="scsm-location" type="text" placeholder="Location contains…" autocomplete="off" aria-label="Location">
      <input id="scsm-from" type="date" aria-label="Created from">
      <input id="scsm-to" type="date" aria-label="Created to">
      <span class="scsm-sort" role="group" aria-label="Sort results">
        <button type="button" data-sort="relevance" class="active">Relevance</button>
        <button type="button" data-sort="newest">Newest</button>
        <button type="button" data-sort="az">A&ndash;Z</button>
      </span>
    </div>
    <div id="scsm-count" class="scsm-count" hidden></div>
    <div id="scsm-tabs" class="scsm-tabs" hidden></div>
    <div id="scsm-status-msg" class="scsm-status" hidden></div>
    <div id="scsm-results" class="scsm-results" aria-live="polite"></div>
  </section>

  <section class="scsm-detail">
    <div id="scsm-detail-empty" class="scsm-detail-empty">Select a ticket to see its details.</div>
    <div id="scsm-detail" class="scsm-detail-content" hidden></div>
  </section>
</div>

<style>
  .scsm-layout { display: flex; gap: 1rem; height: calc(100vh - 12rem); min-height: 30rem; }
  .scsm-master { flex: 3; display: flex; flex-direction: column; min-width: 0; overflow: hidden; background: none; }
  .scsm-searchbar { display: flex; align-items: center; gap: .5rem; padding: .6rem .8rem; border: 1px solid #d0d7de; background: #fff; border-radius: 25px; }
  .scsm-searchbar input { flex: 1; border: none; outline: none; font-size: 1rem; }
  .scsm-search-icon { color: #8b949e; }
  .scsm-kbd { border: 1px solid #d0d7de; border-radius: 4px; padding: .1rem .35rem; font-size: .7rem; color: #57606a; }
  .scsm-tabs { display: flex; gap: .25rem; padding: .4rem .8rem 0; border-bottom: 1px solid #d0d7de; }
  .scsm-tab { background: none; border: none; border-bottom: 2px solid transparent; padding: .4rem .6rem; cursor: pointer; color: #57606a; font-size: .85rem; }
  .scsm-tab.active { border-bottom-color: #006633; color: #006633; font-weight: 600; }
  .scsm-tab .scsm-count { color: #8b949e; margin-left: .25rem; }
  .scsm-filters { display: flex; flex-wrap: wrap; gap: .5rem; padding: .6rem .8rem 0; align-items: center; }
  .scsm-filters select, .scsm-filters input[type="text"], .scsm-filters input[type="date"] { padding: .35rem .5rem; font-size: .82rem; border: 1px solid #d0d7de; border-radius: 6px; background: #fff; color: #24292f; }
  .scsm-sort { display: inline-flex; border: 1px solid #d0d7de; border-radius: 6px; overflow: hidden; }
  .scsm-sort button { border: none; background: #fff; padding: .35rem .6rem; font-size: .82rem; cursor: pointer; color: #57606a; }
  .scsm-sort button.active { background: #006633; color: #fff; }
  .scsm-results { flex: 1; overflow-y: auto; padding: .25rem 0; background: #fff; border: 1px solid #d0d7de; border-top: none; }
  .scsm-status { padding: .4rem .8rem; font-size: .8rem; color: #57606a; }
  #scsm-count { padding: .4rem .8rem 0; font-size: .8rem; color: #57606a; }
  .scsm-result { display: block; width: 100%; text-align: left; padding: .9rem .9rem; border: none; background: none; border-bottom: 1px solid #f0f2f5; cursor: pointer; border-radius: 8px;}
  .scsm-result:hover { background: #f6f8fa; }
  .scsm-title { font-size: .95rem; color: #24292f; display: flex; align-items: center; gap: .45rem; flex-wrap: wrap; }
  .scsm-title-id { color: #006633; }
  .scsm-meta { font-size: .82rem; color: #57606a; margin-top: .4rem; display: flex; align-items: center; gap: .45rem; flex-wrap: wrap; }
  .scsm-snippet { font-size: .82rem; color: #57606a; margin-top: .4rem; }
  .scsm-type-chip { font-size: .68rem; text-decoration: none; color: #fff; background: #57606a; border-radius: 4px; padding: .1rem .4rem; letter-spacing: .03em; }
  .scsm-type-sr { background: #006633; }
  .scsm-type-ir { background: #b26a00; }
  .scsm-status-badge { font-size: .7rem; border-radius: 10px; padding: .1rem .45rem; font-weight: 600; color: #8b949e; background: #eef0f2; }
  .scsm-status-active { color: #006633; background: #e6f4ec; }
  .scsm-status-resolved { color: #2b5a9e; background: #e7eefb; }
  .scsm-status-cancelled { color: #9e2b2b; background: #fbe9e9; }
  .scsm-skeleton { display: block; width: 100%; padding: .9rem .9rem; border: none; background: none; border-bottom: 1px solid #f0f2f5; border-radius: 8px; }
  .scsm-skeleton-bar { display: inline-block; background: #eef0f2; border-radius: 6px; position: relative; overflow: hidden; }
  .scsm-skeleton-bar::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent); animation: scsm-shimmer 1.4s infinite; }
  .scsm-skeleton-chip { width: 1.8rem; height: .85rem; }
  .scsm-skeleton-title { width: 55%; height: .95rem; margin-top: .4rem; }
  .scsm-skeleton-meta { margin-top: .5rem; display: flex; align-items: center; gap: .45rem; }
  .scsm-skeleton-badge { width: 3.4rem; height: .75rem; }
  .scsm-skeleton-text { width: 30%; height: .75rem; }
  .scsm-skeleton-text.short { width: 18%; }
  @keyframes scsm-shimmer { 100% { transform: translateX(100%); } }
  @media (prefers-reduced-motion: reduce) {
    .scsm-skeleton-bar::after { animation: none; display: none; }
  }
  .scsm-detail { flex: 3; min-width: 0; border: 1px solid #d0d7de; border-radius: 8px; overflow-y: auto; background: #fff; }
  .scsm-detail-empty { padding: 1rem; color: #8b949e; }
  .scsm-detail-content { padding: .9rem; display: flex; flex-direction: column; gap: .8rem; }
  .scsm-detail-box { border: 1px solid #e6e9ec; border-radius: 8px; padding: .8rem; }
  .scsm-detail-label { color: #8b949e; font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; margin-bottom: .4rem; }
  .scsm-detail-header { display: flex; align-items: center; gap: .45rem; flex-wrap: wrap; }
  .scsm-detail-header .scsm-status-badge { margin-left: auto; }
  .scsm-detail-id { font-size: .95rem; font-weight: 600; }
  .scsm-detail-title { font-size: 1rem; margin-top: .35rem; }
  .scsm-open { display: inline-block; margin-top: .6rem; padding: .45rem .9rem; background: #006633; color: #fff; border-radius: 6px; text-decoration: none; font-size: .9rem; }
  .scsm-open:hover { background: #004d26; }
  .scsm-detail-list { margin: 0; }
  .scsm-detail-list dt { color: #8b949e; font-size: .75rem; text-transform: uppercase; }
  .scsm-detail-list dd { margin: 0 0 .3rem; font-size: .9rem; }
  .scsm-detail-list dd:last-child { margin-bottom: 0; }
  .scsm-detail-work { margin: 0; font-size: .9rem; color: #24292f; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
  .scsm-person { background: none; border: none; color: #006633; cursor: pointer; padding: 0; font-size: .9rem; text-decoration: underline; }
  .scsm-placeholder { padding: .6rem .8rem; color: #8b949e; }
</style>
{% endblock %}

{% block scripts %}
<script>
(function () {
  'use strict';
  var queryEl = document.getElementById('scsm-query');
  var tabsEl = document.getElementById('scsm-tabs');
  var statusEl = document.getElementById('scsm-status-msg');
  var countEl = document.getElementById('scsm-count');
  var resultsEl = document.getElementById('scsm-results');
  var filtersEl = document.getElementById('scsm-filters');
  var tierEl = document.getElementById('scsm-tier');
  var statusFilterEl = document.getElementById('scsm-status');
  var locationEl = document.getElementById('scsm-location');
  var fromEl = document.getElementById('scsm-from');
  var toEl = document.getElementById('scsm-to');
  var detailEmptyEl = document.getElementById('scsm-detail-empty');
  var detailEl = document.getElementById('scsm-detail');

  var state = {
    query: '',
    user: null,
    roles: [],
    activeRole: null,
    tabs: null,
    pollTimer: null,
    lastSearch: null,
    lastSearchData: null,
    skeletons: false,
    filters: { tier: '', status: '', location: '', from: '', to: '', sort: 'relevance' },
  };

  function esc(s) {
    var div = document.createElement('div');
    div.textContent = s == null ? '' : String(s);
    return div.innerHTML.replace(/"/g, '&quot;');
  }

  function setStatus(text) {
    statusEl.hidden = !text;
    statusEl.textContent = text || '';
  }

  function setCount(n) {
    countEl.hidden = !n;
    countEl.textContent = n === 1 ? '1 result' : n + ' results';
  }

  function clearList() {
    resultsEl.innerHTML = '';
  }

  var SKELETON_ROW =
    '<div class="scsm-skeleton" aria-hidden="true">' +
      '<div class="scsm-skeleton-bar scsm-skeleton-chip"></div>' +
      '<div class="scsm-skeleton-bar scsm-skeleton-title"></div>' +
      '<div class="scsm-skeleton-meta">' +
        '<div class="scsm-skeleton-bar scsm-skeleton-badge"></div>' +
        '<div class="scsm-skeleton-bar scsm-skeleton-text"></div>' +
        '<div class="scsm-skeleton-bar scsm-skeleton-text short"></div>' +
      '</div>' +
    '</div>';

  function renderSkeletons() {
    resultsEl.innerHTML = SKELETON_ROW;
    var probe = resultsEl.firstChild;
    var rowH = probe && probe.offsetHeight ? probe.offsetHeight : 68;
    var count = Math.max(4, Math.min(40, Math.ceil(resultsEl.clientHeight / rowH)));
    var html = '';
    for (var i = 0; i < count; i++) html += SKELETON_ROW;
    resultsEl.innerHTML = html;
    state.skeletons = true;
  }

  var skeletonResizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(skeletonResizeTimer);
    skeletonResizeTimer = setTimeout(function () {
      if (state.skeletons) renderSkeletons();
    }, 150);
  });

  function getFiltersPayload() {
    var f = state.filters;
    var out = {};
    if (f.tier) out.tier = f.tier;
    if (f.status) out.status = f.status;
    if (f.location.trim()) out.location = f.location.trim();
    if (f.from) out.from = f.from;
    if (f.to) out.to = f.to;
    if (f.sort !== 'relevance') out.sort = f.sort;
    return out;
  }

  function loadFilterMeta() {
    fetch('/api/scsm/meta/filters').then(function (r) {
      if (!r.ok) throw new Error('meta');
      return r.json();
    }).then(function (data) {
      [['tiers', tierEl], ['statuses', statusFilterEl]].forEach(function (pair) {
        var list = data[pair[0]] || [];
        list.forEach(function (v) {
          var o = document.createElement('option');
          o.value = v;
          o.textContent = v;
          pair[1].appendChild(o);
        });
        pair[1].hidden = !list.length;
      });
    }).catch(function () {
      tierEl.hidden = true;
      statusFilterEl.hidden = true;
    });
  }

  function syncFiltersState() {
    state.filters.tier = tierEl.value;
    state.filters.status = statusFilterEl.value;
    state.filters.location = locationEl.value;
    state.filters.from = fromEl.value;
    state.filters.to = toEl.value;
  }

  [tierEl, statusFilterEl, locationEl, fromEl, toEl].forEach(function (el) {
    el.addEventListener('input', function () {
      syncFiltersState();
      if (state.query.length >= 2) doSearch(state.query);
    });
  });

  document.querySelectorAll('.scsm-sort button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.scsm-sort button').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      state.filters.sort = btn.getAttribute('data-sort');
      if (state.query.length >= 2) doSearch(state.query);
    });
  });

  function exitPerson() {
    if (state.pollTimer) { clearTimeout(state.pollTimer); state.pollTimer = null; }
    state.user = null;
    state.roles = [];
    state.activeRole = null;
    state.tabs = null;
    renderTabs([]);
  }

  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      queryEl.focus();
      queryEl.select();
    }
  });

  var debounceTimer = null;
  queryEl.addEventListener('input', function () {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(function () {
      var q = queryEl.value.trim();
      if (q === state.query) return;
      exitPerson();
      state.query = q;
      if (q.length < 2) {
        clearList();
        state.skeletons = false;
        setStatus('');
        setCount(0);
        detailEmptyEl.hidden = false;
        detailEl.hidden = true;
        return;
      }
      doSearch(q);
    }, 250);
  });

  function renderTabs(roles, allCount) {
    state.roles = roles;
    if (!roles.length) {
      tabsEl.hidden = true;
      tabsEl.innerHTML = '';
      return;
    }
    tabsEl.hidden = false;
    var html = '<button class="scsm-tab' + (state.activeRole === null ? ' active' : '') +
      '" data-role="all">All results' + (allCount != null ? ' <span class="scsm-count">(' + allCount + ')</span>' : '') + '</button>';
    roles.forEach(function (r) {
      var count = r.count != null ? ' <span class="scsm-count">(' + r.count + ')</span>' : ' <span class="scsm-count">…</span>';
      html += '<button class="scsm-tab' + (state.activeRole === r.role ? ' active' : '') +
        '" data-role="' + r.role + '">' + esc(r.label) + count + '</button>';
    });
    tabsEl.innerHTML = html;
    tabsEl.querySelectorAll('.scsm-tab').forEach(function (btn) {
      btn.addEventListener('click', function () { onTabClick(btn.getAttribute('data-role')); });
    });
  }

  loadFilterMeta();

  function onTabClick(role) {
    if (state.pollTimer) { clearTimeout(state.pollTimer); state.pollTimer = null; }
    if (role === 'all') {
      state.activeRole = null;
      renderTabs(state.roles);
      if (state.lastSearchData) {
        setStatus('');
        renderResults(state.lastSearchData.tickets || [], state.lastSearchData.users || []);
      }
      return;
    }
    state.activeRole = role;
    renderTabs(state.roles);
    loadRoleTickets(role);
  }

  function doSearch(q) {
    setStatus('');
    clearList();
    renderSkeletons();
    state.lastSearch = q;
    Promise.all([
      fetch('/api/scsm/tickets', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ q: q }, getFiltersPayload())) }),
      fetch('/api/scsm/users', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ q: q }) }),
    ]).then(function (rs) {
      if (!rs[0].ok || !rs[1].ok) {
        state.skeletons = false;
        setStatus('Search failed — is the SCSM API configured?');
        setCount(0);
        return;
      }
      return Promise.all(rs.map(function (r) { return r.json(); }));
    }).then(function (data) {
      if (!data || state.query !== q) return;
      state.lastSearchData = { tickets: data[0].results || [], users: data[1].results || [] };
      setStatus('');
      renderTabs([], data[0].total);
      renderResults(state.lastSearchData.tickets, state.lastSearchData.users);
    }).catch(function () {
      state.skeletons = false;
      setStatus('Search failed — is the SCSM API configured?');
      setCount(0);
    });
  }

  function renderResults(tickets, users) {
    var html = '';
    users.forEach(function (u) {
      html += '<button class="scsm-result" data-user-id="' + esc(u.id) + '" data-user-name="' + esc(u.displayName) + '">' +
        '<div class="scsm-title">' + esc(u.displayName) + '</div>' +
        '<div class="scsm-snippet">' + esc(u.userId) + ' · ' + esc(u.upn) + '</div></button>';
    });
    tickets.forEach(function (t) {
      html += ticketRowHtml(t);
    });
    if (!html) html = '<div class="scsm-placeholder">No results.</div>';
    state.skeletons = false;
    resultsEl.innerHTML = html;
    setCount(users.length + tickets.length);

    resultsEl.querySelectorAll('[data-user-id]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        enterPerson({ id: btn.getAttribute('data-user-id'), displayName: btn.getAttribute('data-user-name') }, null);
      });
    });
    resultsEl.querySelectorAll('[data-ticket-id]').forEach(function (btn) {
      var id = btn.getAttribute('data-ticket-id');
      var t = tickets.filter(function (x) { return x.id === id; })[0];
      btn.addEventListener('click', function () { selectTicket(t); });
    });
  }

  function typeChip(t) {
    var type = String(t.ticketType || '').toLowerCase();
    if (type === 'servicerequest') return '<abbr class="scsm-type-chip scsm-type-sr" title="Service Request">SR</abbr>';
    if (type === 'incident') return '<abbr class="scsm-type-chip scsm-type-ir" title="Incident">IR</abbr>';
    return '<span class="scsm-type-chip">' + esc((t.ticketType || 'ticket').toUpperCase()) + '</span>';
  }

  function statusBadge(status) {
    var cls = 'scsm-status-badge';
    var s = String(status || '').toLowerCase();
    if (s === 'active') cls += ' scsm-status-active';
    else if (s === 'resolved') cls += ' scsm-status-resolved';
    else if (s === 'cancelled') cls += ' scsm-status-cancelled';
    return '<span class="' + cls + '">' + esc(status || '—') + '</span>';
  }

  function metaHtml(t) {
    var parts = [statusBadge(t.status)];
    if (t.affectedUser) parts.push('Affected: ' + esc(t.affectedUser.displayName));
    if (t.createdByUser) parts.push('Created by: ' + esc(t.createdByUser.displayName));
    if (t.createdDate) parts.push(esc(new Date(t.createdDate).toLocaleDateString()));
    return '<div class="scsm-meta">' + parts.join('<span>·</span>') + '</div>';
  }

  function ticketRowHtml(t) {
    return '<button class="scsm-result" data-ticket-id="' + esc(t.id) + '">' +
      '<div class="scsm-title">' + typeChip(t) + '<span class="scsm-title-id">' + esc(t.workItemId) + '</span><span>· ' + esc(t.title) + '</span></div>' +
      metaHtml(t) + '</button>';
  }

  function fmtDate(d) {
    return d ? esc(new Date(d).toLocaleString()) : '—';
  }

  function selectTicket(t) {
    detailEmptyEl.hidden = true;
    detailEl.hidden = false;

    var usersDl = '';
    [['affectedUser', 'Affected'], ['createdByUser', 'Created by'], ['assignedUser', 'Assigned to']].forEach(function (p) {
      var person = t[p[0]];
      if (!person) return;
      usersDl += '<dt>' + p[1] + '</dt><dd><button class="scsm-person" data-uid="' + esc(person.id) + '" data-name="' + esc(person.displayName) + '">' + esc(person.displayName) + '</button></dd>';
    });

    var work = t.description || t.resolutionDescription;

    detailEl.innerHTML =
      '<div class="scsm-detail-box">' +
        '<div class="scsm-detail-header">' + typeChip(t) +
          '<span class="scsm-detail-id">' + esc(t.workItemId) + '</span>' +
          statusBadge(t.status) +
        '</div>' +
        '<div class="scsm-detail-title">' + esc(t.title) + '</div>' +
        (t.scsm_url ? '<a class="scsm-open" href="' + esc(t.scsm_url) + '" target="_blank" rel="noopener noreferrer">Open in SCSM ↗</a>' : '') +
      '</div>' +
      '<div class="scsm-detail-box">' +
        '<div class="scsm-detail-label">Users</div>' +
        '<dl class="scsm-detail-list">' + (usersDl || '<dd>—</dd>') + '</dl>' +
      '</div>' +
      '<div class="scsm-detail-box">' +
        '<div class="scsm-detail-label">Dates</div>' +
        '<dl class="scsm-detail-list">' +
          '<dt>Created</dt><dd>' + fmtDate(t.createdDate) + '</dd>' +
          '<dt>Resolved</dt><dd>' + fmtDate(t.resolvedDate) + '</dd>' +
          '<dt>Closed</dt><dd>' + fmtDate(t.closedDate) + '</dd>' +
        '</dl>' +
      '</div>' +
      '<div class="scsm-detail-box">' +
        '<div class="scsm-detail-label">Work</div>' +
        '<p class="scsm-detail-work">' + esc(work || '—') + '</p>' +
      '</div>';

    detailEl.querySelectorAll('.scsm-person').forEach(function (btn) {
      btn.addEventListener('click', function () {
        enterPerson({ id: btn.getAttribute('data-uid'), displayName: btn.getAttribute('data-name') }, t);
      });
    });
  }

  function enterPerson(user, fromTicket) {
    if (state.pollTimer) { clearTimeout(state.pollTimer); state.pollTimer = null; }
    state.user = user;
    state.query = '';
    queryEl.value = '';
    if (fromTicket) {
      fetch('/api/scsm/related', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ticket: fromTicket }) })
        .then(function (r) { if (!r.ok) throw new Error('related-fetch'); return r.json(); })
        .then(function (data) {
          if (!state.user || state.user.id !== user.id) return;
          state.activeRole = data.tabs.length ? data.tabs[0].role : null;
          state.tabs = data.tabs;
          renderTabs(data.tabs);
          if (state.activeRole) loadRoleTickets(state.activeRole);
        })
        .catch(function () { setStatus('Related tickets unavailable — SCSM API error.'); });
    } else {
      var roles = [
        { role: 'affected', label: 'Affected user', user: user, count: null },
        { role: 'created_by', label: 'Created by', user: user, count: null },
        { role: 'assigned', label: 'Assigned', user: user, count: null },
      ];
      state.activeRole = 'affected';
      state.tabs = null;
      renderTabs(roles);
      loadRoleTickets('affected');
    }
  }

  function loadRoleTickets(role) {
    if (!state.user) return;
    var uid = state.user.id;
    if (state.tabs) {
      for (var i = 0; i < state.tabs.length; i++) {
        if (state.tabs[i].role === role) { uid = state.tabs[i].id; break; }
      }
    }
    var url = '/api/scsm/users/' + encodeURIComponent(uid) + '/tickets?role=' + encodeURIComponent(role);
    fetch(url).then(function (r) {
      if (!r.ok) { setStatus('Related tickets unavailable — SCSM API error.'); return null; }
      return r.json();
    }).then(function (data) {
      if (!data || !state.user || state.activeRole !== role) return;
      if (data.ready) {
        updateTabCount(role, data.total);
        setStatus('');
        renderRoleResults(data.results || []);
        if (state.pollTimer) { clearTimeout(state.pollTimer); state.pollTimer = null; }
      } else {
        updateTabCount(role, null);
        setStatus('');
        renderSkeletons();
        state.pollTimer = setTimeout(function () { loadRoleTickets(role); }, 2000);
      }
    }).catch(function () { setStatus('Related tickets unavailable — SCSM API error.'); });
  }

  function updateTabCount(role, count) {
    state.roles.forEach(function (r) { if (r.role === role) r.count = count; });
    renderTabs(state.roles);
  }

  function renderRoleResults(rows) {
    var html = rows.map(ticketRowHtml).join('');
    if (!html) html = '<div class="scsm-placeholder">No tickets in this role.</div>';
    state.skeletons = false;
    resultsEl.innerHTML = html;
    setCount(rows.length);
    resultsEl.querySelectorAll('[data-ticket-id]').forEach(function (btn) {
      var id = btn.getAttribute('data-ticket-id');
      var t = rows.filter(function (x) { return x.id === id; })[0];
      btn.addEventListener('click', function () { selectTicket(t); });
    });
  }
})();
</script>
{% endblock %}
