services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./workbook_url.txt:/app/workbook_url.txt:ro
    env_file:
      - .env
    restart: unless-stopped
    labels:
      - "app.mode=prod"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s