  <circle cx="23.5" cy="34.5" r="3.6" fill="#4A2170"/>
  <path d="M40.20,29.90 L41.29,31.06 L42.89,30.94 L42.76,32.54 L43.92,33.63 L42.76,34.72 L42.89,36.32 L41.29,36.20 L40.20,37.36 L39.11,36.20 L37.51,36.32 L37.64,34.72 L36.48,33.63 L37.64,32.54 L37.51,30.94 L39.11,31.06 Z" fill="#4A2170"/>
  <circle cx="40.2" cy="33.63" r="1.4" fill="#FFFFFF"/>
