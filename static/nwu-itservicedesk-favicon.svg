<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="nArmF" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1E7A78"/>
      <stop offset="100%" stop-color="#3FBFB0"/>
    </linearGradient>
    <linearGradient id="wArmF" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#1E7A78"/>
